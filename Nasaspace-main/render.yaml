# ============================================================================
# ASTRAHEALTH-AI — Blueprint de Despliegue en Render
# ============================================================================

services:
  # 1. Backend API (FastAPI + Supabase PostgreSQL + scikit-learn)
  - type: web
    name: astrahealth-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Configurar en el panel de Render con la cadena de Supabase
      - key: CORS_ORIGINS
        sync: false # Configurar con la URL del frontend en Render o "*"

  # 2. Frontend Dashboard (React + Vite)
  - type: web
    name: astrahealth-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Configurar con la URL pública generada para astrahealth-backend
